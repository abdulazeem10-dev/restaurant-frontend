<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Foodway</title><link rel="stylesheet" href="assets/styles.css"></head><body><main class="auth"><div class="workspace"><a class="brand" href="index.html"><b>F</b><strong>Foodway workspace</strong></a><p class="eyebrow">SECURE WORKSPACE</p><h1>Sign in</h1><p class="lede">Use your platform admin, restaurant owner, or secondary admin account.</p><form id="login"><input name="email" type="email" required placeholder="Email"><input name="password" type="password" required placeholder="Password"><button class="primary">Continue</button><p id="error" class="empty" hidden></p></form></div></main><script src="assets/auth.js"></script><script>document.querySelector("#login").onsubmit=async e=>{e.preventDefault();const error=document.querySelector("#error");try{const r=await api("/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});sessionStorage.setItem("restaurant-app-token",r.token);location.href=r.user.role==="admin"?"admin.html":(r.user.role==="delivery"?"delivery.html":"dashboard.html")}catch(x){error.hidden=false;error.textContent=x.message}}</script></body></html>
