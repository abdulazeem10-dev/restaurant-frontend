<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Platform admin | Sunrise Tiffin House</title><link rel="stylesheet" href="../assets/css/style.css"></head>
<body><header><h1>Platform Admin</h1><nav><a href="../customer/index.html">Customer site</a><button id="logout" class="secondary">Log out</button></nav></header><main>
<p id="message" role="status"></p><section class="panel"><h2>Onboard a restaurant</h2><p>Create the restaurant’s owner account. Give the owner their login credentials securely.</p><form id="restaurant-form" class="form-grid">
<label>Restaurant name<br><input name="restaurantName" required maxlength="150"></label><label>Restaurant address<br><input name="address" required minlength="5" maxlength="500"></label><label>Description<br><input name="description" maxlength="2000"></label><label>Owner name<br><input name="ownerName" required maxlength="100"></label><label>Owner email / username<br><input name="email" type="email" required maxlength="254"></label><label>Initial password (12+ characters)<br><input name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><button type="submit">Create pending restaurant</button></form></section>
<section><h2>Restaurants</h2><div id="restaurants" class="grid"></div></section></main><script src="../assets/js/common.js"></script><script src="../assets/js/admin.js"></script></body></html>
