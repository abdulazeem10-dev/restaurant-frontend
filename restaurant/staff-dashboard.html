<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Staff workspace | Sunrise Tiffin House</title><link rel="stylesheet" href="../assets/css/style.css"></head>
<body><header><h1 id="staff-title">Restaurant Staff</h1><nav><a href="../customer/index.html">Customer site</a><button id="logout" class="secondary">Log out</button></nav></header>
<main><p id="message" role="status"></p><p id="staff-summary" class="muted"></p>
<section id="menu-section" class="panel" hidden><h2>Menu</h2><form id="menu-form" class="form-grid"><label>Item name<br><input name="name" required maxlength="150"></label><label>Category<br><input name="category" required maxlength="80" placeholder="Mains"></label><label>Price in rupees<br><input name="price" type="number" min="0.01" step="0.01" required></label><label>Description<br><input name="description" maxlength="1000"></label><button type="submit">Add menu item</button></form><div id="menu-items" class="grid"></div></section>
<section class="panel order-desk"><div class="desk-heading"><div><p class="eyebrow">SERVICE DESK</p><h2 id="orders-heading">Orders &amp; billing</h2></div><span class="desk-note">Dine-in tables and online delivery in one place</span></div><p id="orders-help" class="muted"></p><div id="ticket-builder" class="ticket-builder"><div><h3>Start a dine-in ticket</h3><p class="muted">Add menu items as guests order.</p></div><form id="dine-in-form" class="form-grid"><label>Table number<br><input name="tableNumber" required maxlength="20" placeholder="e.g. 2"></label><label>Guest name (optional)<br><input name="customerName" maxlength="100"></label><label>Menu item<br><select id="ticket-menu-item" required></select></label><label>Qty<br><input id="ticket-quantity" type="number" min="1" max="20" value="1" required></label><button id="add-ticket-item" type="button" class="secondary">Add item</button><button type="submit">Create table order</button></form><div id="ticket-basket" class="ticket-basket muted">Choose an item to start the ticket.</div></div><div class="desk-toolbar"><div><h3>Live orders</h3><p id="order-summary" class="muted">Updating automatically</p></div><label>Show<br><select id="order-filter"><option value="all">All orders</option><option value="dine_in">Dine-in tables</option><option value="delivery">App &amp; website delivery</option></select></label></div><div id="orders" class="grid order-grid"></div></section>
</main><script src="../assets/js/common.js"></script><script src="../assets/js/restaurant-orders.js"></script><script src="../assets/js/restaurant-staff.js"></script></body></html>
