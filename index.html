<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunrise Tiffin House</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background: #f6f5ef;
      padding: 48px 28px;
      color: #123d32;
    }

    .hero {
      max-width: 1550px;
      min-height: 480px;
      margin: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      border-radius: 32px;
      background: #124637;
    }

    .hero-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 70px;
      color: white;
    }

    .eyebrow {
      margin-bottom: 28px;
      color: #f6e89f;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      max-width: 680px;
      margin-bottom: 28px;
      font-size: clamp(42px, 5vw, 76px);
      line-height: 0.98;
      letter-spacing: -3px;
    }

    h1 span {
      display: block;
      color: #dced9f;
    }

    .description {
      max-width: 520px;
      margin-bottom: 34px;
      color: #eaf1e6;
      font-size: 22px;
      line-height: 1.55;
    }

    .hero-footer {
      display: flex;
      align-items: center;
      gap: 26px;
      flex-wrap: wrap;
    }

    .hero-button {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 18px 28px;
      border-radius: 999px;
      background: #e34135;
      color: white;
      font-size: 18px;
      font-weight: 800;
      text-decoration: none;
      transition: 0.2s ease;
    }

    .hero-button:hover {
      background: #f05243;
      transform: translateY(-2px);
    }

    .location {
      color: #f5f0c2;
      font-size: 16px;
      font-weight: 700;
    }

    .hero-image {
      min-height: 480px;
      overflow: hidden;
      position: relative;
    }

    .hero-image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    @media (max-width: 900px) {
      body {
        padding: 20px 14px;
      }

      .hero {
        grid-template-columns: 1fr;
        border-radius: 24px;
      }

      .hero-content {
        padding: 42px 28px;
      }

      .hero-image {
        min-height: 300px;
        order: -1;
      }
    }

    @media (max-width: 500px) {
      .hero-content {
        padding: 34px 22px;
      }

      h1 {
        font-size: 40px;
      }

      .description {
        font-size: 18px;
      }

      .hero-button {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <main class="hero">
    <section class="hero-content">
      <p class="eyebrow">Mumbai · Your local food guide</p>

      <h1>
        Welcome to
        <span>Sunrise Tiffin House</span>
      </h1>

      <p class="description">
        Freshly prepared breakfast, dosa, idli and comforting tiffin
        favourites made fresh every morning.
      </p>

      <div class="hero-footer">
        <a id="breakfastButton" class="hero-button" href="#menu">
          Explore breakfast <span>→</span>
        </a>

        <p class="location">Sector 19, Ulwe, Navi Mumbai</p>
      </div>
    </section>

    <div class="hero-image">
      <img
        id="breakfastImage"
        src="https://images.unsplash.com/photo-1533089860892-a7c6f0a88666?auto=format&fit=crop&w=1400&q=85"
        alt="Fresh breakfast food"
      />
    </div>
  </main>

  <script>
    console.log("[Foodway] Breakfast hero feature initialized");

    const breakfastButton = document.getElementById("breakfastButton");
    const breakfastImage = document.getElementById("breakfastImage");

    console.log("[Foodway] Breakfast button found:", !!breakfastButton);
    console.log("[Foodway] Breakfast image found:", !!breakfastImage);

    breakfastImage.addEventListener("load", () => {
      console.log("[Foodway] Breakfast image loaded successfully");
    });

    breakfastImage.addEventListener("error", () => {
      console.error("[Foodway] Breakfast image failed to load");
    });

    breakfastButton.addEventListener("click", () => {
      console.log("[Foodway] User clicked Explore breakfast");
      console.log("[Foodway] Navigating to #menu");
    });

    window.addEventListener("resize", () => {
      console.log(
        "[Foodway] Responsive layout updated:",
        window.innerWidth + "px"
      );
    });

    console.log("[Foodway] All breakfast hero features are ready");
  </script>
</body>
</html>
