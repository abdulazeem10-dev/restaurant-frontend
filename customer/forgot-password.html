<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password | Sunrise Tiffin House</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/foodway-theme.css">
</head>
<body class="customer-page auth-page">
<header class="auth-header"><a class="wordmark" href="index.html"><span class="wordmark-icon">S</span><span>Sunrise Tiffin House</span></a><a href="login.html">Back to login</a></header>
<main>
  <h2>Forgot password?</h2>
  <p>Enter the email address for your account. If it is registered, we’ll email you a reset link.</p>
  <form id="reset-request-form">
    <p><label>Email<br><input type="email" name="email" required autocomplete="email"></label></p>
    <button type="submit">Send reset link</button>
  </form>
  <p id="message" role="status"></p>
</main>
<script src="../assets/js/common.js"></script>
<script>
document.querySelector("#reset-request-form").addEventListener("submit", async event => {
  event.preventDefault();
  const message = document.querySelector("#message");
  const email = new FormData(event.currentTarget).get("email");
  setStatusMessage(message, "Sending…");

  try {
    const response = await fetch(`${API_BASE}/auth/password-reset/request`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Unable to request a reset link");
    setStatusMessage(message, data.message, "success");
    event.currentTarget.reset();
  } catch (error) {
    setStatusMessage(message, error.message, "error");
  }
});
</script>
</body>
</html>
