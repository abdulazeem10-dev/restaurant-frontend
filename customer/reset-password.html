<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="../assets/icons/icon-192.png?v=20261110-3">
<title>Reset password | Al Madina Family Restaurant</title>
  <link rel="stylesheet" href="../assets/css/style.css">

  <link rel="stylesheet" href="../assets/css/support-chat.css?v=20261109-3">
  <link rel="stylesheet" href="../assets/css/foodway-theme.css?v=20261114-10">
</head>
<body class="customer-page auth-page">
<header class="auth-header"><a class="wordmark" href="index.html"><!-- Header logo temporarily hidden; restore this image when needed: <img class="brand-logo" src="../assets/images/al-madina-family-restaurant.png" alt="Al Madina Family Restaurant"> -->Al-Madina</a><a href="login.html">Back to login</a></header>
<main>
  <h2>Choose a new password</h2>
  <p>Use at least 12 characters.</p>
  <form id="reset-password-form">
    <p><label>New password<br><input type="password" name="password" required minlength="12" maxlength="128" autocomplete="new-password"></label></p>
    <p><label>Confirm new password<br><input type="password" name="confirmPassword" required minlength="12" maxlength="128" autocomplete="new-password"></label></p>
    <button type="submit">Reset password</button>
  </form>
  <p id="message" role="status"></p>
</main>
<script src="../assets/js/common.js"></script>
<script>
document.querySelector("#reset-password-form").addEventListener("submit", async event => {
  event.preventDefault();
  const message = document.querySelector("#message");
  const form = new FormData(event.currentTarget);
  const password = form.get("password");

  if (password !== form.get("confirmPassword")) {
    setStatusMessage(message, "The passwords do not match.", "error");
    return;
  }

  const token = new URLSearchParams(location.search).get("token");
  if (!token) {
    setStatusMessage(message, "This reset link is missing its token. Request a new one.", "error");
    return;
  }

  setStatusMessage(message, "Resetting password…");
  try {
    const response = await fetch(`${API_BASE}/auth/password-reset/confirm`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, password })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Unable to reset password");
    setStatusMessage(message, `${data.message} `, "success");
    const link = document.createElement("a");
    link.href = "login.html";
    link.textContent = "Sign in";
    message.append(link);
    event.currentTarget.reset();
    history.replaceState(null, "", location.pathname);
  } catch (error) {
    setStatusMessage(message, error.message, "error");
  }
});
</script>
  <script src="../assets/js/support-chat.js?v=20261109-3"></script>
</body>
</html>
