<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Al-Madina</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/foodway-theme.css">
</head>
<body class="customer-page auth-page">
<header class="auth-header"><a class="wordmark" href="index.html"><span class="wordmark-icon">A</span><span>Al-Madina</span></a><a href="index.html">Back to Al-Madina</a></header>
<main>
  <h2>Login</h2>
  <p>Sign in to place orders and view their status.</p>
  <section id="password-login">
    <form id="login-form">
      <p><label>Email<br><input type="email" name="email" required autocomplete="email"></label></p>
      <p><label>Password<br><input type="password" name="password" required autocomplete="current-password"></label></p>
      <button type="submit">Login</button>
    </form>
    <p><button id="show-phone-login" class="secondary" type="button">Sign in with phone number</button></p>
    <p><a href="forgot-password.html">Forgot password?</a></p>
  </section>

  <section id="phone-login" hidden>
    <h3>Sign in with your phone</h3>
    <form id="phone-form">
      <p><label>Mobile number<br><input type="tel" name="phone" required autocomplete="tel" inputmode="tel" maxlength="25" placeholder="+91 98765 43210"></label></p>
      <button id="send-otp" type="submit">Send OTP</button>
    </form>
    <form id="otp-form" hidden>
      <p id="otp-sent-message" class="muted" aria-live="polite"></p>
      <p><label>6-digit OTP<br><input type="text" name="code" required inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="Enter OTP"></label></p>
      <button id="verify-otp" type="submit">Verify and sign in</button>
      <button id="resend-otp" class="secondary" type="button">Resend OTP</button>
      <button id="change-phone" class="secondary" type="button">Use another number</button>
    </form>
    <p><button id="show-password-login" class="secondary" type="button">Back to email and password</button></p>
  </section>
  <p class="auth-divider" hidden>or continue with</p>
  <div id="google-signin-button" role="status" hidden></div>
  <p id="message" role="status"></p>
  <p>New here? <a href="register.html">Create a customer account</a>.</p>
</main>
<script src="../assets/js/common.js"></script><script src="../assets/js/google-auth.js"></script><script>
document.querySelector("#login-form").addEventListener("submit", async event => {
  event.preventDefault();
  const message = document.querySelector("#message");
  setStatusMessage(message, "Signing in…");
  const form = new FormData(event.currentTarget);
  try {
    const response = await fetch(`${API_BASE}/auth/login`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: form.get("email"), password: form.get("password") }) });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Unable to sign in");
    completeLogin(data);
  } catch (error) { setStatusMessage(message, error.message, "error"); }
});

function completeLogin(data) {
  sessionStorage.setItem(TOKEN_KEY, data.accessToken);
  if (data.user.role === "restaurant") location.href = "../restaurant/dashboard.html";
  else if (data.user.role === "restaurant_staff") location.href = "../restaurant/staff-dashboard.html";
  else if (data.user.role === "admin") location.href = "../admin/dashboard.html";
  else if (data.user.role === "delivery") location.href = "../delivery/dashboard.html";
  else {
    const next = new URLSearchParams(location.search).get("next");
    location.href = ["cart.html", "payment.html"].includes(next) ? next : "index.html";
  }
}

const phoneLogin = document.querySelector("#phone-login");
const phoneForm = document.querySelector("#phone-form");
const otpForm = document.querySelector("#otp-form");
const loginMessage = document.querySelector("#message");
let requestedPhone = "";

document.querySelector("#show-phone-login").addEventListener("click", () => {
  document.querySelector("#password-login").hidden = true;
  phoneLogin.hidden = false;
  setStatusMessage(loginMessage, "");
});
document.querySelector("#show-password-login").addEventListener("click", () => {
  phoneLogin.hidden = true;
  document.querySelector("#password-login").hidden = false;
  setStatusMessage(loginMessage, "");
});

async function requestOtp(phone) {
  const sendButton = document.querySelector("#send-otp");
  const resendButton = document.querySelector("#resend-otp");
  sendButton.disabled = true;
  resendButton.disabled = true;
  setStatusMessage(loginMessage, "Sending OTP…");
  try {
    const response = await fetch(`${API_BASE}/auth/phone/otp/request`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Could not send OTP");
    requestedPhone = phone;
    phoneForm.hidden = true;
    otpForm.hidden = false;
    document.querySelector("#otp-sent-message").textContent = `Enter the code sent to ${phone}. ${data.message || ""}`;
    otpForm.elements.code.focus();
    setStatusMessage(loginMessage, "");
  } catch (error) {
    setStatusMessage(loginMessage, error.message, "error");
  } finally {
    sendButton.disabled = false;
    resendButton.disabled = false;
  }
}

phoneForm.addEventListener("submit", event => {
  event.preventDefault();
  requestOtp(new FormData(phoneForm).get("phone").trim());
});
document.querySelector("#resend-otp").addEventListener("click", () => requestOtp(requestedPhone));
document.querySelector("#change-phone").addEventListener("click", () => {
  otpForm.reset();
  otpForm.hidden = true;
  phoneForm.hidden = false;
  phoneForm.elements.phone.focus();
  setStatusMessage(loginMessage, "");
});
otpForm.addEventListener("submit", async event => {
  event.preventDefault();
  const verifyButton = document.querySelector("#verify-otp");
  verifyButton.disabled = true;
  setStatusMessage(loginMessage, "Verifying OTP…");
  try {
    const response = await fetch(`${API_BASE}/auth/phone/otp/verify`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone: requestedPhone, code: new FormData(otpForm).get("code") })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Unable to verify OTP");
    completeLogin(data);
  } catch (error) {
    setStatusMessage(loginMessage, error.message, "error");
  } finally {
    verifyButton.disabled = false;
  }
});

renderGoogleSignInButton();
</script>
</body>
</html>
