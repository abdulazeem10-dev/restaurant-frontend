<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Food Platform</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<header><h1>Food Platform</h1><a href="index.html">Home</a></header>
<main>
  <h2>Login</h2>
  <p>Sign in to place orders and view their status.</p>
  <form id="login-form">
    <p><label>Email<br><input type="email" name="email" required autocomplete="email"></label></p>
    <p><label>Password<br><input type="password" name="password" required autocomplete="current-password"></label></p>
    <button type="submit">Login</button>
  </form>
  <p id="message" role="status"></p>
  <p>New here? <a href="register.html">Create a customer account</a>.</p>
</main>
<script src="../assets/js/common.js"></script><script>
document.querySelector("#login-form").addEventListener("submit", async event => {
  event.preventDefault();
  const message = document.querySelector("#message");
  message.textContent = "Signing in…";
  const form = new FormData(event.currentTarget);
  try {
    const response = await fetch(`${API_BASE}/auth/login`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: form.get("email"), password: form.get("password") }) });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Unable to sign in");
    sessionStorage.setItem(TOKEN_KEY, data.accessToken);
    if (data.user.role === "restaurant") location.href = "../restaurant/dashboard.html";
    else if (data.user.role === "restaurant_staff") location.href = "../restaurant/staff-dashboard.html";
    else if (data.user.role === "delivery") location.href = "../delivery/dashboard.html";
    else if (data.user.role === "admin") location.href = "../admin/dashboard.html";
    else location.href = new URLSearchParams(location.search).get("next") === "cart.html" ? "cart.html" : "index.html";
  } catch (error) { message.textContent = error.message; }
});
</script>
</body>
</html>
